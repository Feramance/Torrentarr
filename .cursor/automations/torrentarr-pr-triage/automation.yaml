# Torrentarr PR Triage — Cursor Automation definition (repo-managed)
#
# Import: cursor.com/automations/new → use settings below, paste prompt from prompt.md
# Future: Cursor may auto-discover .cursor/automations/ (see forum feature request)
#
# https://cursor.com/docs/cloud-agent/automations

name: torrentarr-pr-triage
display_name: Torrentarr PR Triage
enabled: false  # start disabled; test on #229 or #271 before enabling

repository:
  url: https://github.com/Feramance/Torrentarr
  branch: master

triggers:
  - type: github
    repository: Feramance/Torrentarr
    events:
      - pull_request.opened
      - pull_request.pushed

tools:
  - comment_on_pr
  # Do NOT enable approve_pr or request_reviewers until triage is validated

permissions: private  # or team_visible

model: default

prompt_file: .cursor/automations/torrentarr-pr-triage/prompt.md

ground_truth:
  - docs/audits/pr-triage-2026-06-15.md
  - AGENTS.md
  - docs/parity/contract-baseline.md
