# Torrentarr PR Validation — Cursor Automation definition (repo-managed)
#
# Setup: ./scripts/open-pr-triage-automation-editor.sh
#   → opens cursor.com/automations/new (blank editor)
#   → paste prompt.md, configure triggers/tools below, Create
# Future: Cursor may auto-discover .cursor/automations/ (forum feature request)

# https://cursor.com/docs/cloud-agent/automations

name: torrentarr-pr-validation
display_name: Torrentarr PR Validation
enabled: false  # start disabled; test on #229 or #271 before enabling

repository:
  url: https://github.com/Feramance/Torrentarr
  branch: master

triggers:
- type: github
  repository: Feramance/Torrentarr
  events:
  - pull_request.opened
  - pull_request.pushed

tools:
- comment_on_pr
  # Do NOT enable approve_pr or request_reviewers until validation is trusted

permissions: private  # or team_visible

model: default

prompt_file: .cursor/automations/torrentarr-pr-triage/prompt.md

ground_truth:
- docs/audits/pr-triage-2026-06-15.md
- AGENTS.md
- docs/parity/contract-baseline.md
