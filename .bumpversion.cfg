[bumpversion]
current_version = 6.19.1-1
commit = False
tag = false
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)-(?P<build>\d+)
serialize = 
	{major}.{minor}.{patch}-{build}

[bumpversion:part:build]
first_value = 1

[bumpversion:file:Directory.Build.props]
search = <Version>{current_version}</Version>
replace = <Version>{new_version}</Version>

[bumpversion:file:Dockerfile]
search = ARG VERSION="{current_version}"
replace = ARG VERSION="{new_version}"

[bumpversion:file:docs/index.md]
search = **Latest Release**: v{current_version}
replace = **Latest Release**: v{new_version}
