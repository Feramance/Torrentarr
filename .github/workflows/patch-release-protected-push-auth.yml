name: Patch release protected-push auth

on:
  push:
    branches:
    - master
    paths:
    - .github/workflows/patch-release-protected-push-auth.yml

permissions:
  contents: write

jobs:
  patch_release_auth:
    name: Align release protected writes with PAT auth
    runs-on: ubuntu-latest
    steps:
    - name: Checkout master with release PAT
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: master
        token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

    - name: Patch release workflow
      run: |
        python3 <<'PYEOF'
        from pathlib import Path

        path = Path('.github/workflows/release.yml')
        lines = path.read_text(encoding='utf-8').splitlines(keepends=True)

        target = 'token: $' + '{{ secrets.GITHUB_TOKEN }}'
        replacement = 'token: $' + '{{ secrets.PAT || secrets.GITHUB_TOKEN }}'
        protected_jobs = {'prepare_release', 'changelog', 'publish_release'}
        current_job = None
        replaced = 0
        output = []

        for line in lines:
            if line.startswith('  ') and not line.startswith('    ') and line.rstrip().endswith(':'):
                current_job = line.strip()[:-1]

            if current_job in protected_jobs and line.strip() == target:
                indent = line[:len(line) - len(line.lstrip())]
                newline = '\n' if line.endswith('\n') else ''
                output.append(f'{indent}{replacement}{newline}')
                replaced += 1
            else:
                output.append(line)

        if replaced != 3:
            raise SystemExit(f'Expected to replace 3 protected release checkout tokens; replaced {replaced}')

        path.write_text(''.join(output), encoding='utf-8')
        PYEOF

        rm -f .github/workflows/patch-release-protected-push-auth.yml

        git add .github/workflows/release.yml .github/workflows/patch-release-protected-push-auth.yml
        git diff --cached --check
        git diff --cached -- .github/workflows/release.yml

    - name: Commit patch
      run: |
        git config user.name "${{ github.actor }}"
        git config user.email "${{ github.actor }}@users.noreply.github.com"
        git commit -m '[skip ci] Fix release protected-branch authentication'
        git push origin master
