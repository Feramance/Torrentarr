name: Patch release protected-push auth

on:
  push:
    branches:
    - master
    paths:
    - .github/workflows/patch-release-protected-push-auth.yml

permissions:
  contents: write

jobs:
  patch_release_auth:
    name: Align release protected writes with PAT auth
    runs-on: ubuntu-latest
    steps:
    - name: Checkout master with release PAT
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: master
        token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

    - name: Patch release workflow
      run: |
        python3 <<'PYEOF'
        from pathlib import Path

        path = Path('.github/workflows/release.yml')
        content = path.read_text(encoding='utf-8')

        replacements = {
            """    - name: Checkout repository\n      uses: actions/checkout@v7\n      with:\n        fetch-depth: 0\n        token: ${{ secrets.GITHUB_TOKEN }}\n    - name: Determine release type\n""":
            """    - name: Checkout repository\n      uses: actions/checkout@v7\n      with:\n        fetch-depth: 0\n        token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}\n    - name: Determine release type\n""",
            """  changelog:\n    name: Generate changelog and release notes\n    runs-on: ubuntu-latest\n    needs:\n    - prepare_release\n    - build_and_push_docker\n    if: needs.prepare_release.result == 'success'\n    steps:\n    - uses: actions/checkout@v7\n      with:\n        fetch-depth: 0\n        token: ${{ secrets.GITHUB_TOKEN }}\n""":
            """  changelog:\n    name: Generate changelog and release notes\n    runs-on: ubuntu-latest\n    needs:\n    - prepare_release\n    - build_and_push_docker\n    if: needs.prepare_release.result == 'success'\n    steps:\n    - uses: actions/checkout@v7\n      with:\n        fetch-depth: 0\n        token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}\n""",
            """  publish_release:\n    name: Publish GitHub release\n    runs-on: ubuntu-latest\n    needs:\n    - prepare_release\n    - changelog\n    - build_binaries\n    if: needs.prepare_release.result == 'success'\n    steps:\n    - uses: actions/checkout@v7\n      with:\n        fetch-depth: 0\n        token: ${{ secrets.GITHUB_TOKEN }}\n""":
            """  publish_release:\n    name: Publish GitHub release\n    runs-on: ubuntu-latest\n    needs:\n    - prepare_release\n    - changelog\n    - build_binaries\n    if: needs.prepare_release.result == 'success'\n    steps:\n    - uses: actions/checkout@v7\n      with:\n        fetch-depth: 0\n        token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}\n""",
        }

        for old, new in replacements.items():
            count = content.count(old)
            if count != 1:
                raise SystemExit(f'Expected exactly one match for release auth block; found {count}')
            content = content.replace(old, new, 1)

        path.write_text(content, encoding='utf-8')
        PYEOF

        rm -f .github/workflows/patch-release-protected-push-auth.yml

        git add .github/workflows/release.yml .github/workflows/patch-release-protected-push-auth.yml
        git diff --cached --check
        git diff --cached -- .github/workflows/release.yml

    - name: Commit patch
      run: |
        git config user.name "${{ github.actor }}"
        git config user.email "${{ github.actor }}@users.noreply.github.com"
        git commit -m '[skip ci] Fix release protected-branch authentication'
        git push origin master
