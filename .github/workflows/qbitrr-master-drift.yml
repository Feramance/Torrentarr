name: qBitrr master drift

on:
  schedule:
  - cron: 23 4 * * 1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Compare OpenAPI with qBitrr master
      continue-on-error: true
      env:
        QBITRR_OPENAPI_REF: master
      run: |
        set -o pipefail
        bash scripts/check-openapi-drift.sh docs/assets/openapi.json 2>&1 | tee qbitrr-master-drift.txt
    - name: Upload drift report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: qbitrr-master-drift
        path: qbitrr-master-drift.txt
