# Run pre-commit and publish any fixes as a patch for review.

name: Pre-commit auto-fix patch

on:
  push:
    branches:
    - '**'

permissions:
  contents: read

jobs:
  pre-commit-autofix:
    runs-on: ubuntu-latest
    if: github.event.deleted == false && startsWith(github.ref, 'refs/heads/')
    steps:
    - name: Checkout without write credentials
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.12'

    - name: Install pre-commit
      run: pip install pre-commit==4.6.2

    - name: Run pre-commit (autofix)
      run: pre-commit run --all-files || true

    - name: Create patch
      id: changes
      run: |
        if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
          git diff --binary --full-index --no-ext-diff > pre-commit.patch
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload patch
      if: steps.changes.outputs.has_changes == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: pre-commit-patch-${{ github.run_id }}-${{ github.run_attempt }}
        path: pre-commit.patch
        if-no-files-found: error
        retention-days: 1
