# Auto-fix and commit pre-commit changes when a commit wasn't pre-processed (any branch).

name: Pre-commit auto-fix and commit

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  pre-commit-autofix:
    runs-on: ubuntu-latest
    # Skip when this workflow already created the commit (avoid loop)
    if: startsWith(github.ref, 'refs/heads/') && (github.event_name != 'push' || github.event.head_commit.message == null || !startsWith(github.event.head_commit.message, '[pre-commit] auto fixes'))
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Verify checkout credentials are not persisted
      run: |
        if git config --local --name-only --get-regexp '^http\..*\.extraheader$'; then
          echo "Checkout left an HTTP authentication header in the repository config." >&2
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install pre-commit
      run: pip install pre-commit

    - name: Run pre-commit (autofix)
      run: pre-commit run --all-files || true

    - name: Check for changes
      id: changes
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Commit fixes
      if: steps.changes.outputs.has_changes == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "[pre-commit] auto fixes from pre-commit hooks" -m "for more information, see https://pre-commit.ci"

    - name: Push fixes
      if: steps.changes.outputs.has_changes == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        GIT_CONFIG_COUNT=1
        GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
        GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
        export GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
        for i in 1 2 3; do
          if git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
            exit 0
          fi
          if [ "$i" -lt 3 ]; then
            echo "Push failed (attempt $i/3), retrying in 10s..."
            sleep 10
          fi
        done
        echo "Push failed after 3 attempts." >&2
        exit 1
