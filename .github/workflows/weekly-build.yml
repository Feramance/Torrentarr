name: Weekly Build Release

on:
  schedule:
    # Monday 06:00 UTC
  - cron: 0 6 * * 1
  workflow_dispatch:
    inputs:
      dispatch_build_release:
        description: After merging Dependabot PRs, dispatch Create a Release (build).
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

defaults:
  run:
    shell: bash

jobs:
  weekly_build:
    name: Merge Dependabot PRs and optionally release build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
        ref: master

    - name: Auto-merge green Dependabot PRs
      id: merge_dependabot
      env:
        GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        merged_any=false
        mapfile -t numbers < <(
          gh pr list --repo "${{ github.repository }}" --state open --author "app/dependabot" --json number --jq '.[].number'
        )

        if [[ ${#numbers[@]} -eq 0 ]]; then
          echo "No open Dependabot PRs."
          echo "merged=false" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        for number in "${numbers[@]}"; do
          meta=$(gh pr view "${number}" --repo "${{ github.repository }}" \
            --json title,labels,mergeable,body,author,headRefName,headRefOid,isCrossRepository,headRepositoryOwner,files,changedFiles \
            --jq '{title:.title,labels:([.labels[].name]|join(",")),mergeable:.mergeable,body:.body,author:.author.login,headRefName:.headRefName,headRefOid:.headRefOid,isCrossRepository:.isCrossRepository,headOwner:.headRepositoryOwner.login,files:([.files[].path]|join("\n")),changedFiles:.changedFiles}')
          title=$(echo "${meta}" | jq -r '.title')
          labels=$(echo "${meta}" | jq -r '.labels')
          mergeable=$(echo "${meta}" | jq -r '.mergeable')
          body=$(echo "${meta}" | jq -r '.body // ""')
          author=$(echo "${meta}" | jq -r '.author')
          head_ref=$(echo "${meta}" | jq -r '.headRefName')
          head_sha=$(echo "${meta}" | jq -r '.headRefOid')
          is_cross=$(echo "${meta}" | jq -r '.isCrossRepository')
          head_owner=$(echo "${meta}" | jq -r '.headOwner')
          files=$(echo "${meta}" | jq -r '.files // ""')
          changed_files=$(echo "${meta}" | jq -r '.changedFiles // 0')
          file_count=$(printf '%s\n' "${files}" | grep -c . || true)

          echo "Evaluating Dependabot PR #${number}: ${title} (${head_sha})"
          if [[ "${author}" != "dependabot[bot]" ]]; then echo "Skipping PR #${number} (author=${author})."; continue; fi
          if [[ "${head_ref}" != dependabot/* ]]; then echo "Skipping PR #${number} (head ref ${head_ref})."; continue; fi
          if [[ "${is_cross}" == "true" && "${head_owner}" != "dependabot" ]]; then echo "Skipping PR #${number} (cross-repo owner ${head_owner})."; continue; fi
          if [[ "${body}" == *"version-update:semver-major"* ]] || [[ "${labels}" == *"major"* ]] || [[ "${labels}" == *"breaking"* ]]; then echo "Skipping PR #${number} (major/breaking update)."; continue; fi
          if echo "${files}" | grep -qE '^(\.github/|scripts/)' || echo "${files}" | grep -qE '^(Dockerfile|docker-compose[^/]*\.ya?ml|build\.(sh|bat)|Directory\.Build\.props|global\.json|nuget\.config)$'; then echo "Skipping PR #${number} (CI, Docker, scripts, or build-config)."; continue; fi
          if [[ "${changed_files}" -gt "${file_count}" ]]; then echo "Skipping PR #${number}: file list truncated."; continue; fi
          if [[ "${labels}" == *"github_actions"* ]] || [[ "${labels}" == *"github-actions"* ]]; then echo "Skipping PR #${number} (GitHub Actions ecosystem)."; continue; fi
          if [[ "${mergeable}" != "MERGEABLE" ]]; then echo "Skipping PR #${number} (mergeable=${mergeable})."; continue; fi
          if ! gh pr checks "${number}" --repo "${{ github.repository }}" --required; then echo "Skipping PR #${number}: required checks not green."; continue; fi

          current_sha=$(gh pr view "${number}" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid')
          if [[ "${current_sha}" != "${head_sha}" ]]; then echo "Skipping PR #${number}: HEAD moved."; continue; fi
          if gh pr merge "${number}" --repo "${{ github.repository }}" --squash --delete-branch --match-head-commit "${head_sha}"; then
            echo "Merged PR #${number} at ${head_sha}."
            merged_any=true
          else
            echo "Could not merge PR #${number}; continuing."
          fi
        done

        echo "merged=${merged_any}" >> "${GITHUB_OUTPUT}"

    - name: Refresh master
      run: |
        git fetch origin master
        git checkout master
        git reset --hard origin/master

    - name: Decide whether to release a build
      id: should_release
      env:
        GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
        EVENT_NAME: ${{ github.event_name }}
        DISPATCH_BUILD_RELEASE: ${{ github.event.inputs.dispatch_build_release || 'false' }}
      run: |
        set -euo pipefail

        if [[ "${EVENT_NAME}" == "workflow_dispatch" ]] && [[ "${DISPATCH_BUILD_RELEASE}" != "true" ]]; then
          echo "release=false" >> "${GITHUB_OUTPUT}"
          echo "Skipping build release (manual dispatch opted out)."
          exit 0
        fi

        releases=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases")
        last_release=$(printf '%s' "${releases}" | jq -sc '[.[][] | select(.draft == false and .published_at != null)] | max_by(.published_at)')
        if [[ "${last_release}" == "null" ]]; then
          echo "release=false" >> "${GITHUB_OUTPUT}"
          echo "No published release to use as a baseline; skipping build release."
          exit 0
        fi

        published_at=$(printf '%s' "${last_release}" | jq -r '.published_at')
        age=$(( $(date -u +%s) - $(date -u -d "${published_at}" +%s) ))
        if [[ "${age}" -le 604800 ]]; then
          echo "release=false" >> "${GITHUB_OUTPUT}"
          echo "Last release is not more than seven days old; skipping build release."
          exit 0
        fi

        last_tag=$(printf '%s' "${last_release}" | jq -r '.tag_name')
        count=$(git rev-list --count "${last_tag}..HEAD")
        echo "Commits since ${last_tag}: ${count}"
        if [[ "${count}" -eq 0 ]]; then
          echo "release=false" >> "${GITHUB_OUTPUT}"
          echo "No commits since last release; skipping build release."
          exit 0
        fi

        subjects=$(git log --format='%s' "${last_tag}..HEAD")
        while IFS= read -r subject; do
          case "${subject}" in
            "[patch]"*|"[minor]"*|"[major]"*)
              echo "Skipping build release: unreleased commit requires its own release: ${subject}"
              echo "release=false" >> "${GITHUB_OUTPUT}"
              exit 0
              ;;
          esac
        done <<< "${subjects}"

        paths=$(git diff --name-only "${last_tag}..HEAD")
        invalid_paths=()
        eligible_paths=0
        while IFS= read -r path; do
          case "${path}" in
            ""|CHANGELOG.md) continue ;;
            .github/*|package.json|*/package.json|package-lock.json|*/package-lock.json|pnpm-lock.yaml|*/pnpm-lock.yaml|yarn.lock|*/yarn.lock|bun.lockb|*/bun.lockb|*.csproj|Directory.Packages.props|packages.lock.json|*/packages.lock.json|requirements*.txt|*/requirements*.txt|pyproject.toml|*/pyproject.toml|poetry.lock|*/poetry.lock|uv.lock|*/uv.lock|Pipfile|*/Pipfile|Pipfile.lock|*/Pipfile.lock|go.mod|*/go.mod|go.sum|*/go.sum|Cargo.toml|*/Cargo.toml|Cargo.lock|*/Cargo.lock|composer.json|*/composer.json|composer.lock|*/composer.lock|Gemfile.lock|*/Gemfile.lock) eligible_paths=$((eligible_paths + 1)) ;;
            *) invalid_paths+=("${path}") ;;
          esac
        done <<< "${paths}"

        if [[ ${#invalid_paths[@]} -gt 0 ]]; then
          printf 'Skipping build release: unreleased non-dependency/non-automation paths:\n%s\n' "${invalid_paths[@]}"
          echo "release=false" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        if [[ "${eligible_paths}" -eq 0 ]]; then
          echo "release=false" >> "${GITHUB_OUTPUT}"
          echo "No dependency/automation changes since last release; skipping build release."
          exit 0
        fi

        echo "release=true" >> "${GITHUB_OUTPUT}"

    - name: Wait for passing Build and Test
      id: build_tests
      if: steps.should_release.outputs.release == 'true'
      env:
        GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        sha=$(git rev-parse HEAD)
        echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

        for attempt in $(seq 0 60); do
          runs=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow build.yml \
            --branch master --commit "${sha}" --limit 100 \
            --json databaseId,headSha,headBranch,event,status,conclusion)
          latest=$(printf '%s' "${runs}" | jq -c --arg sha "${sha}" \
            '[.[] | select(.headSha == $sha and .headBranch == "master" and (.event == "push" or .event == "schedule" or .event == "workflow_dispatch"))] | max_by(.databaseId)')
          if [[ "${latest}" == "null" ]]; then
            echo "Skipping build release: no Build and Test run for master at ${sha}."
            break
          fi
          status=$(printf '%s' "${latest}" | jq -r '.status')
          conclusion=$(printf '%s' "${latest}" | jq -r '.conclusion')
          if [[ "${status}" == "completed" ]]; then
            if [[ "${conclusion}" == "success" ]]; then
              echo "passed=true" >> "${GITHUB_OUTPUT}"
              echo "Build and Test passed for ${sha}."
              exit 0
            fi
            echo "Skipping build release: Build and Test concluded ${conclusion} for ${sha}."
            break
          fi
          if [[ "${attempt}" -eq 60 ]]; then
            echo "Skipping build release: Build and Test did not finish within 30 minutes for ${sha}."
            break
          fi
          echo "Waiting for Build and Test (${status}) for ${sha}."
          sleep 30
        done
        echo "passed=false" >> "${GITHUB_OUTPUT}"

    - name: Dispatch build release
      if: steps.should_release.outputs.release == 'true' && steps.build_tests.outputs.passed == 'true'
      env:
        GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        current_sha=$(git ls-remote origin refs/heads/master | cut -f1)
        if [[ "${current_sha}" != "${{ steps.build_tests.outputs.sha }}" ]]; then
          echo "Skipping build release: master moved since Build and Test was checked."
          exit 0
        fi
        gh workflow run "Create a Release" --repo "${{ github.repository }}" -f release_type=build
        echo "Dispatched Create a Release with release_type=build"
