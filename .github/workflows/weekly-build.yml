name: Weekly Build Release

on:
  schedule:
    # Monday 06:00 UTC
  - cron: 0 6 * * 1
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  weekly_build:
    name: Merge Dependabot PRs and release build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
        ref: master

    # Extra identity/gating vs qBitrr: require dependabot[bot] + dependabot/ head,
    # skip workflow/Actions PRs, gate on required checks, pin merge to HEAD SHA.
    # PAT remains the qBitrr-compatible token for squash-merge + release dispatch.
    - name: Auto-merge green Dependabot PRs
      env:
        GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        mapfile -t numbers < <(
          gh pr list \
            --repo "${{ github.repository }}" \
            --state open \
            --author "app/dependabot" \
            --json number \
            --jq '.[].number'
        )

        if [[ ${#numbers[@]} -eq 0 ]]; then
          echo "No open Dependabot PRs."
          exit 0
        fi

        for number in "${numbers[@]}"; do
          meta=$(gh pr view "${number}" --repo "${{ github.repository }}" \
            --json title,labels,mergeable,body,author,headRefName,headRefOid,isCrossRepository,headRepositoryOwner,files,changedFiles \
            --jq '{
              title: .title,
              labels: ([.labels[].name] | join(",")),
              mergeable: .mergeable,
              body: .body,
              author: .author.login,
              headRefName: .headRefName,
              headRefOid: .headRefOid,
              isCrossRepository: .isCrossRepository,
              headOwner: .headRepositoryOwner.login,
              files: ([.files[].path] | join("\n")),
              changedFiles: .changedFiles
            }')
          title=$(echo "${meta}" | jq -r '.title')
          labels=$(echo "${meta}" | jq -r '.labels')
          mergeable=$(echo "${meta}" | jq -r '.mergeable')
          body=$(echo "${meta}" | jq -r '.body // ""')
          author=$(echo "${meta}" | jq -r '.author')
          head_ref=$(echo "${meta}" | jq -r '.headRefName')
          head_sha=$(echo "${meta}" | jq -r '.headRefOid')
          is_cross=$(echo "${meta}" | jq -r '.isCrossRepository')
          head_owner=$(echo "${meta}" | jq -r '.headOwner')
          files=$(echo "${meta}" | jq -r '.files // ""')
          changed_files=$(echo "${meta}" | jq -r '.changedFiles // 0')
          file_count=$(printf '%s\n' "${files}" | grep -c . || true)

          echo "Evaluating Dependabot PR #${number}: ${title} (${head_sha})"

          if [[ "${author}" != "dependabot[bot]" ]]; then
            echo "Skipping PR #${number} (author=${author}, expected dependabot[bot])."
            continue
          fi

          if [[ "${head_ref}" != dependabot/* ]]; then
            echo "Skipping PR #${number} (head ref ${head_ref} is not a Dependabot branch)."
            continue
          fi

          if [[ "${is_cross}" == "true" && "${head_owner}" != "dependabot" ]]; then
            echo "Skipping PR #${number} (cross-repo head owner ${head_owner} is not dependabot)."
            continue
          fi

          if [[ "${body}" == *"version-update:semver-major"* ]] || \
             [[ "${labels}" == *"major"* ]] || \
             [[ "${labels}" == *"breaking"* ]]; then
            echo "Skipping PR #${number} (major/breaking update)."
            continue
          fi

          if echo "${files}" | grep -E '^\.github/(workflows|actions)/'; then
            echo "Skipping PR #${number} (changes GitHub Actions workflow or action files)."
            continue
          fi

          if [[ "${changed_files}" -gt "${file_count}" ]]; then
            echo "Skipping PR #${number}: file list truncated (${file_count}/${changed_files}); cannot verify workflow paths."
            continue
          fi

          if [[ "${labels}" == *"github_actions"* ]] || \
             [[ "${labels}" == *"github-actions"* ]]; then
            echo "Skipping PR #${number} (GitHub Actions ecosystem)."
            continue
          fi

          if [[ "${mergeable}" != "MERGEABLE" ]]; then
            echo "Skipping PR #${number} (mergeable=${mergeable})."
            continue
          fi

          if ! gh pr checks "${number}" --repo "${{ github.repository }}" --required; then
            echo "Skipping PR #${number}: required checks not green."
            continue
          fi

          current_sha=$(gh pr view "${number}" --repo "${{ github.repository }}" \
            --json headRefOid --jq '.headRefOid')
          if [[ "${current_sha}" != "${head_sha}" ]]; then
            echo "Skipping PR #${number}: HEAD moved from ${head_sha} to ${current_sha}."
            continue
          fi

          if gh pr merge "${number}" \
            --repo "${{ github.repository }}" \
            --squash \
            --delete-branch \
            --match-head-commit "${head_sha}"; then
            echo "Merged PR #${number} at ${head_sha}."
          else
            echo "Could not merge PR #${number}; continuing."
          fi
        done

    - name: Refresh master
      run: |
        git fetch origin master
        git checkout master
        git reset --hard origin/master

    - name: Decide whether to release a build
      id: should_release
      run: |
        set -euo pipefail

        last_tag=$(git tag -l 'v*' --sort=-version:refname | head -n1 || true)
        if [[ -z "${last_tag}" ]]; then
          echo "No previous release tags found; will release."
          echo "release=true" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        count=$(git rev-list --count "${last_tag}..HEAD")
        echo "Commits since ${last_tag}: ${count}"
        if [[ "${count}" -gt 0 ]]; then
          echo "release=true" >> "${GITHUB_OUTPUT}"
        else
          echo "release=false" >> "${GITHUB_OUTPUT}"
          echo "No commits since last release; skipping build release."
        fi

    - name: Dispatch build release
      if: steps.should_release.outputs.release == 'true'
      env:
        GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
      run: |
        gh workflow run "Create a Release" \
          --repo "${{ github.repository }}" \
          -f release_type=build
        echo "Dispatched Create a Release with release_type=build"
